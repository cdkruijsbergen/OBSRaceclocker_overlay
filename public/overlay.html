<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Boreas Race Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay">
    <div class="overlay-topbar">
      <div class="topbar-strip">
        <span class="topbar-chevron">»</span>
        <span class="topbar-field" id="veldLabel">Mix2x</span>
        <span class="topbar-mode" id="modeLabel">Timetrial</span>
      </div>
    </div>

    <div class="overlay-content">
      <div class="overlay-header">
        <img src="Boreas.png" class="logo" alt="Boreas">
        <div class="title">
          <div class="title-main" id="titleMain">Strijkbokaal Finale</div>
          <div class="title-sub">Boreas Race Results</div>
        </div>
      </div>

      <div class="finale-block">
      </div>

      <div class="timetrial-block">
        <div class="timetrial-list" id="timetrialList"></div>
      </div>
    </div>

    <div class="overlay-bottombar"></div>

    <script>
      function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      function routeField(route) {
        try {
          if (!route || !route.includes('?')) return '';
          const params = new URLSearchParams(route.split('?')[1] || '');
          return params.get('veld') || '';
        } catch (e) {
          return '';
        }
      }

      function routeCat(route) {
        try {
          if (!route || !route.includes('?')) return '';
          const params = new URLSearchParams(route.split('?')[1] || '');
          return params.get('cat') || '';
        } catch (e) {
          return '';
        }
      }

      async function loadFinale(veld, cat) {
        const res = await fetch(`/api/finale?veld=${encodeURIComponent(veld || "")}&cat=${encodeURIComponent(cat || "")}`);
        const data = await res.json();

        const titleMain = document.getElementById("titleMain");
        const label = cat ? `Resultaten ${cat.replace(/^[A-Z0-9+]+/i, '').replace(/F([A-Q])[0-9]*$/i, '$1 Finale')}` : 'Strijkbokaal Finale';
        titleMain.textContent = label;

        document.getElementById("veldLabel").textContent = veld || "Alle velden";

        const container = document.getElementById("timetrialList");
        container.innerHTML = "";

        const rows = Array.isArray(data.results) ? data.results : [];
        rows.forEach(item => {
          const row = document.createElement("div");
          row.className = "timetrial-row";
          row.innerHTML = `
            <div class="tt-name">${item.name || ''}</div>
            <div class="tt-club">${item.club || ''}</div>
            <div class="tt-time">${item.displayTime || '--:--,--'}</div>
          `;
          container.appendChild(row);
        });
      }

      async function loadTimetrial(veld, compactNames) {
        const compact = compactNames ? 1 : 0;
        const res = await fetch(`/api/timetrial?veld=${encodeURIComponent(veld || "")}&compact=${compact}`);
        const list = await res.json();
        const container = document.getElementById("timetrialList");
        container.innerHTML = "";

        list.forEach(item => {
          const row = document.createElement("div");
          row.className = "timetrial-row";
          row.innerHTML = `
            <div class="tt-name">${item.name}</div>
            <div class="tt-club">${item.club}</div>
            <div class="tt-time">${item.displayTime}</div>
          `;
          container.appendChild(row);
        });
      }

      async function loadStartlist(veld) {
        const res = await fetch(`/api/startlist?veld=${encodeURIComponent(veld || "")}`);
        const rows = await res.json();
        const container = document.getElementById("timetrialList");
        container.innerHTML = '';

        rows.forEach(row => {
          const item = document.createElement("div");
          item.className = 'timetrial-row';
          item.innerHTML = `
            <div class="tt-name">${row.name || ''}</div>
            <div class="tt-club">${row.club || ''}</div>
            <div class="tt-time">--:--,--</div>
          `;
          container.appendChild(item);
        });
      }

      async function refresh() {
        const stateRes = await fetch('/api/overlay-state');
        const state = await stateRes.json();
        const route = state.globalUrlToggle ? '/overlay.html' : (state.route || '/overlay.html');
        const urlVeld = getParam('veld') || '';
        const urlCat = getParam('cat') || '';
        const veld = urlVeld || routeField(route) || state.activeField || '';
        const cat = urlCat || routeCat(route) || state.activeCat || '';
        const mode = String(state.mode || 'Timetrial');

        document.getElementById('veldLabel').textContent = veld || 'Alle velden';
        document.getElementById('modeLabel').textContent = mode;

        if (/Startlijst/i.test(mode)) {
          await loadStartlist(veld);
          return;
        }

        if (/Finale/i.test(mode)) {
          await loadFinale(veld, cat);
          return;
        }

        await loadTimetrial(veld, state.compactNames !== false);
      }

      refresh();
      fetch('/api/overlay-state')
        .then(res => res.json())
        .then(state => {
          if (state.autoRefresh !== false) {
            setInterval(refresh, 2000); // elke 2s verversen
          }
        });
    </script>
  </div>
</body>
</html>
