<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Boreas Race Timetrial Live</title>
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <div class="live-page">
    <div class="live-topbar">
      <span class="live-topbar-chevron">»</span>
      <span class="live-topbar-field" id="veldLabel">Mix2x</span>
      <span class="live-topbar-mode" id="modeLabel">Timetrial</span>
    </div>

    <div class="live-content">
      <div class="live-timetrial-title">Live resultaat</div>

      <div class="live-summary">
        <div class="live-summary-row">
          <div class="live-summary-label">Snelste tijd</div>
          <div class="live-summary-name" id="fastestName">—</div>
          <div class="live-summary-club" id="fastestClub"></div>
          <div class="live-summary-time" id="fastestTime">--:--,--</div>
        </div>

        <div class="live-summary-row latest-row">
          <div class="live-summary-label">Recentste tijd</div>
          <div class="live-summary-name" id="latestName">—</div>
          <div class="live-summary-club" id="latestClub"></div>
          <div class="live-summary-time" id="latestTime">--:--,--</div>
          <div class="live-summary-diff" id="latestDiff">±0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function routeField(route) {
      try {
        if (!route || !route.includes('?')) return '';
        const params = new URLSearchParams(route.split('?')[1] || '');
        return params.get('veld') || '';
      } catch (e) {
        return '';
      }
    }

    function routeCat(route) {
      try {
        if (!route || !route.includes('?')) return '';
        const params = new URLSearchParams(route.split('?')[1] || '');
        return params.get('cat') || '';
      } catch (e) {
        return '';
      }
    }

    function formatSignedDiff(diff) {
      if (diff === null || diff === undefined) return '±0.00';
      const sign = diff < 0 ? '-' : '+';
      return `${sign}${String(Math.abs(diff / 1000)).padStart(4, '0')}`;
    }

    async function loadLive(veld, compactNames, cat) {
      const compact = compactNames ? 1 : 0;
      const res = await fetch(`/api/live?veld=${encodeURIComponent(veld || "")}&cat=${encodeURIComponent(cat || "")}&compact=${compact}`);
      const data = await res.json();
      const veldLabel = document.getElementById('veldLabel');
      veldLabel.textContent = veld || 'Alle velden';

      if (data.fastest) {
        document.getElementById('fastestName').textContent = data.fastest.name;
        document.getElementById('fastestClub').textContent = data.fastest.club;
        document.getElementById('fastestTime').textContent = data.fastest.displayTime;
      } else {
        document.getElementById('fastestName').textContent = '—';
        document.getElementById('fastestClub').textContent = '';
        document.getElementById('fastestTime').textContent = '--:--,--';
      }

      if (data.latest) {
        document.getElementById('latestName').textContent = data.latest.name;
        document.getElementById('latestClub').textContent = data.latest.club;
        document.getElementById('latestTime').textContent = data.latest.displayTime;
        const diff = Number(data.diff || 0);
        const diffNode = document.getElementById('latestDiff');
        const diffDisplay = data.diffDisplay || (diff < 0 ? `-${Math.abs(diff / 1000).toFixed(2)}` : `+${Math.abs(diff / 1000).toFixed(2)}`);
        diffNode.textContent = diffDisplay;
        diffNode.className = diff < 0 ? 'live-summary-diff live-summary-diff-fast' : 'live-summary-diff live-summary-diff-slow';
      } else {
        document.getElementById('latestName').textContent = '—';
        document.getElementById('latestClub').textContent = '';
        document.getElementById('latestTime').textContent = '--:--,--';
        const diffNode = document.getElementById('latestDiff');
        diffNode.textContent = '±0.00';
        diffNode.className = 'live-summary-diff';
      }
    }

    async function refresh() {
      const stateRes = await fetch('/api/overlay-state');
      const state = await stateRes.json();
      const route = state.globalUrlToggle ? '/live.html' : (state.liveRoute || '/live.html');
      const urlVeld = getParam('veld') || '';
      const urlCat = getParam('cat') || '';
      const veld = urlVeld || routeField(route) || state.activeField || '';
      const cat = urlCat || routeCat(route) || state.activeCat || '';
      const mode = String(state.mode || 'Timetrial');

      document.getElementById('veldLabel').textContent = veld || 'Alle velden';
      document.getElementById('modeLabel').textContent = mode;

      await loadLive(veld, state.compactNames !== false, cat);
    }

    refresh();
    fetch('/api/overlay-state')
      .then(res => res.json())
      .then(state => {
        if (state.autoRefresh !== false) {
          setInterval(refresh, 1500);
        }
      });
  </script>
</body>
</html>
